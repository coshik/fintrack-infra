apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: fintrack
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service } }
    spec:
      containers:
      - name: payment-service
        image: coshik/payment-service:v1
        env: [{ name: FAIL_RATE, value: "0" }]
        ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: fintrack
spec:
  selector: { app: payment-service }
  ports: [{ port: 5000 }]
