apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fintrack
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: coshik/frontend:v1
        ports: [{ containerPort: 5000 }]
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits: { memory: "128Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fintrack
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ name: http, port: 5000, nodePort: 30080 }]
