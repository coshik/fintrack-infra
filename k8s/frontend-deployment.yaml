apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fintrack
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: coshik/frontend:v1
        ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fintrack
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 5000, nodePort: 30080 }]
