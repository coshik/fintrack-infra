name: Generate Changelog
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pull-requests: write
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build changelog since last tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## ${GITHUB_REF_NAME}" > CHANGELOG.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --oneline >> CHANGELOG.md
          else
            git log --oneline >> CHANGELOG.md
          fi
      - name: Open a PR with the changelog
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update changelog for ${{ github.ref_name }}"
          branch: "changelog/${{ github.ref_name }}"
          title: "Changelog for ${{ github.ref_name }}"
          body: "Auto-generated changelog for release ${{ github.ref_name }}."
